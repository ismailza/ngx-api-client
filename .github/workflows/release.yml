name: Release

on:
  push:
    branches:
      - main
  # Manual publish of whatever is currently on main, e.g. to recover from a
  # half-finished release run.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Maintains a release PR from conventional commits: bumps the version in
  # projects/ngx-api-client/package.json and writes the changelog. Merging that
  # PR tags the commit and publishes a GitHub Release.
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds the package once so both registries receive identical contents. Each
  # publish job packs its own tarball from this directory, so the two must stay
  # on the same Node and npm — a differing npm changes the shasum.
  build:
    name: Build
    needs: release-please
    if: needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      # `postbuild` stages LICENSE and CHANGELOG.md, which ng-packagr does not
      # copy, so this produces the same bytes CI validated.
      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm run verify:package

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/ngx-api-client
          retention-days: 7

  # Stages the release on npmjs through trusted publishing (OIDC): no token is
  # stored in the repo. A staged version is not public until a maintainer
  # approves it with 2FA (`npm stage approve` or on npmjs.com). The npm trusted
  # publisher for this workflow should allow staged publish only — moving
  # dist-tags afterwards is done by dist-tag.yml.
  publish-npm:
    name: Stage on npmjs
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: package

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing for `npm stage` needs a newer npm than Node bundles.
      - name: Update npm
        run: npm install -g npm@11.21.0

      # The tag is fixed at staging time and applied on approval. Prereleases
      # go to `next` so they never become `latest` by accident.
      - name: Stage publish
        working-directory: package
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          echo "Staging $version with dist-tag '$tag'"
          npm stage publish --tag "$tag" --provenance --access public

  publish-gpr:
    name: Publish to GitHub Packages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: package

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@ismailza'

      # Same npm as publish-npm so both registries get the same tarball.
      - name: Update npm
        run: npm install -g npm@11.21.0

      - run: npm publish ./package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
